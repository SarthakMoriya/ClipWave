<!DOCTYPE html>
<html>

<head>
    <title>Clipboard Hub</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- TOP BAR -->
    <div id="topbar">
        <span id="status">🔴 Disconnected</span>
    </div>

    <!-- MAIN -->
    <div id="container">

        <!-- LEFT: Activity -->
        <div id="feed"></div>

        <!-- RIGHT: Devices -->
        <div id="devices">
            <h3>Devices</h3>
            <div id="deviceList">
                <!-- <div class="device-item">
                    <span class="device-name">My Phone</span>
                    <span class="device-status">Online</span>
                </div> -->
            </div>
        </div>

    </div>

    <!-- BOTTOM -->
    <div id="controls">
        <button id="pauseBtn">Pause</button>
        <button id="sendFileBtn">Send File</button>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
